name: build

on:
  push:
    branches-ignore:
      - master
    tags:
      - '*'

jobs:
  # The pushed version is what the E2E job installs.
  Build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: exordos/exordos_ci/.github/workflows/element_build.yml@master
    with:
      push-target: exordos_repo
      element-dir: output
    secrets:
      PUSH_CFG: ${{ secrets.PUSH_EXORDOS_CFG }}

  # End-to-end run on a realm, through exordos_ci's shared workflow: the
  # elements built from this commit installed on it, then the functional suite
  # run on the realm itself, where the data plane nodes are reachable.
  E2E:
    needs: Build
    uses: exordos/exordos_ci/.github/workflows/element_realm_test.yml@master
    with:
      # Installed in this order: observability requires both plugins.
      elements: victoriaaas grafanaaas observability
      version: ${{ needs.Build.outputs.version }}
      # No element gets more than ten minutes to come up.
      element-timeout: 600
      ssh: true
      overbook: true
      dependencies: metapaas
      check-script: .github/scripts/run-functional-in-realm.sh
    secrets: inherit
