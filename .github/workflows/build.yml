name: build

on:
  push:
    branches-ignore:
      - master
    tags:
      - '*'

jobs:
  # The self-hosted runners come with packer, KVM and the exordos CLI already
  # set up, so the build is just checkout + build + push. The pushed version
  # is what the E2E job installs.
  Build:
    runs-on: [self-hosted, vm]
    if: ${{ github.actor != 'dependabot[bot]' }}
    outputs:
      version: ${{ steps.build_element.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build Element
        id: build_element
        env:
          PUSH_EXORDOS_CFG: ${{ secrets.PUSH_EXORDOS_CFG }}
        run: |
          set -eux

          VERSION="$(exordos get-version .)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          exordos build $(pwd)

          # Decode and write the push configuration
          echo "$PUSH_EXORDOS_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -e output -t exordos_repo -f --latest

  # End-to-end run on a realm, through exordos_tests' shared workflow: the
  # elements built from this commit installed on it, then the functional suite
  # run on the realm itself, where the data plane nodes are reachable.
  E2E:
    needs: Build
    uses: exordos/exordos_tests/.github/workflows/element_realm_test.yml@realm_ssh_input
    with:
      # Installed in this order: observability requires both plugins.
      elements: victoriaaas grafanaaas observability
      version: ${{ needs.Build.outputs.version }}
      # The metapaas CP and then the data plane nodes boot in turn.
      element-timeout: 2700
      ssh: true
      prepare-script: .github/scripts/prepare-realm.sh
      check-script: .github/scripts/run-functional-in-realm.sh
      tests-ref: realm_ssh_input
    secrets: inherit
