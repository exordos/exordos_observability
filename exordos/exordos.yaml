build:
  deps:
    - dst: /opt/exordos_metapaas
      path:
        src: ../../exordos_observability
      exclude:
        - .venv
        - .tox
        - output

  elements:
    # Communal shared observability cluster (1 Victoria instance + 1 Grafana
    # instance + datasources) for platform-wide use.
    - manifest: manifests/observability.yaml.j2

    # Example consumer element: declaratively creates its own Victoria +
    # Grafana instances + datasource, used as the functional-test fixture.
    - manifest: manifests/example_observability.yaml.j2

    # Example victoriaaas-only element: declaratively creates a single
    # Victoria (metrics+logs) storage instance, no Grafana consumer.
    - manifest: manifests/example_victoriaaas.yaml.j2

    - manifest: manifests/example_grafana_dashboard.yaml.j2

    # Victoria storages dataplane image (launched per victoria instance by
    # the infra builder).
    - manifest: manifests/victoriaaas.yaml.j2
      artifacts:
        - script: images/build_wheel.sh
          name: pypi_package
          artifacts:
            - ../dist/*.whl
      images:
      - name: exordos-metapaas-victoria-dp
        format: GEN_IMG_FORMAT=zst
        profile: exordos_base
        script: images/victoria_dp_install.sh
        override:
          disk_size: "6G"

    # Grafana consumer dataplane image (launched per grafana instance by the
    # infra builder).
    - manifest: manifests/grafanaaas.yaml.j2
      artifacts:
        - script: images/build_wheel.sh
          name: pypi_package
          artifacts:
            - ../dist/*.whl
      images:
      - name: exordos-metapaas-grafana-dp
        format: GEN_IMG_FORMAT=zst
        profile: exordos_base
        script: images/grafana_dp_install.sh
        override:
          disk_size: "6G"
